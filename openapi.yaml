---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: hmatsu-notebook-api
  description: API used by the HMATSU Notebook application
spec:
  type: openapi
  lifecycle: production
  owner: hmatsu-admin
  definition: |
    openapi: "3.0.0"

    info:
      title: HMATSU Notebook API
      version: 1.0.0
      description: API for managing HMATSU notebook data

    servers:
      - url: https://YOUR-DEPLOYED-DOMAIN.com

    paths:
      /api/notes:
        get:
          summary: Retrieve notes
          responses:
            "200":
              description: Notes retrieved successfully

        post:
          summary: Create a note
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    title:
                      type: string
                    content:
                      type: string
          responses:
            "201":
              description: Note created successfully
